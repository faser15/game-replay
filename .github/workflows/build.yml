name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and verify
        shell: pwsh
        run: ./build.ps1 -Test
      - uses: actions/upload-artifact@v4
        with:
          name: GameReplay-windows-x64
          path: artifacts/win-x64/
